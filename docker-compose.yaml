version: '3.8'

services:

  backend:
    build:
      context: obiadomat
      dockerfile: Dockerfile
    container_name: obiadomat-backend
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python3 -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./obiadomat:/app/obiadomat
    ports:
      - "8000:8000"
      - "5678:5678"
    env_file:
      - ./obiadomat/.env
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 512M # Adjust according to your system
        reservations:
          memory: 256M

  db:
    image: postgres:16.5-alpine
    container_name: obiadomat-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./obiadomat/.env
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: obiadomat-pgadmin
    env_file:
      - ./obiadomat/.env
    ports:
      - "5050:5050"

volumes:
  postgres_data: