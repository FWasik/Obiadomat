{% extends 'base.html' %}

{% block content %}
  <div class="container mx-auto p-6 flex flex-col items-center justify-center gap-6">
    <h1 class="text-2xl font-semibold mb-4 text-center">Are you sure you want to delete this lunch session?</h1>
    <p class="text-center">{{ object.name }}</p>
    <form method="post" class="flex gap-4">
      {% csrf_token %}
      <button type="submit" class="bg-red-500 text-white py-2 px-4 rounded hover:bg-red-600">Yes, Delete</button>
      <a href="{% url 'lunch_sessions:lunch_session_list' %}" class="bg-gray-500 text-white py-2 px-4 rounded hover:bg-gray-600">Cancel</a>
    </form>
  </div>
{% endblock %}
