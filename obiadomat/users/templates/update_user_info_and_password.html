{% extends 'base.html' %}
{% load static %}
{% load tailwind_filters %}

{% block content %}
    <div class="flex justify-center py-8 bg-gray-100">
        <div class="w-full max-w-5xl p-8 bg-white rounded-lg shadow-lg">
            <div class="flex flex-col md:flex-row md:space-x-8">

                <div class="w-full md:w-1/2 mb-8 md:mb-0">
                    <h1 class="text-3xl font-semibold text-center text-gray-700 mb-6">Update Info</h1>
                    <hr class="my-4">
                    <form method="post" class="space-y-4">
                        {% csrf_token %}
                        {{ user_form|crispy }}
                        <button type="submit" name="user_info_submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            Update
                        </button>
                    </form>
                </div>

                <div class="hidden md:block md:w-1 md:bg-gray-300 md:mx-4"></div>
                <hr class="block md:hidden my-4">

                <div class="w-full md:w-1/2">
                    <h1 class="text-3xl font-semibold text-center text-gray-700 mb-6">Update Password</h1>
                    <hr class="my-4">
                    <form method="post" class="space-y-4">
                        {% csrf_token %}
                        {{ password_form|crispy }}
                        <button type="submit" name="password_change_submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            Update
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
{% endblock content %}
