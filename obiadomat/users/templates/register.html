{% extends 'base.html' %}
{% load static %}
{% load tailwind_filters %}

{% block content %}
    <div class="flex justify-center py-8 bg-gray-100">
        <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-lg">
            <h1 class="text-3xl font-semibold text-center text-gray-700 mb-6">Register</h1>
            <hr class="my-4">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Register
                </button>
            </form>
        </div>
    </div>
{% endblock content %}
